# Builds the Windows x64 program (cross compiled with llvm-mingw on Linux) and keeps it as a download on the run page.
# Open the run under the Actions tab and download the artifact "C64-GrooveGoat-Windows-x64".
name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
  SDL_URL: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
  SDL_SHA256: 83a5d74012311edc3c0d40ea6faecbe57ad692aa033fa5dc273cc937e3938ff2

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the toolchain and SDL 2
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSfL -o llvm.tar.xz "$LLVM_MINGW_URL"
          curl -sSfL -o sdl.tar.gz "$SDL_URL"
          echo "$LLVM_MINGW_SHA256  llvm.tar.xz" | sha256sum -c -
          echo "$SDL_SHA256  sdl.tar.gz" | sha256sum -c -
          tar xf llvm.tar.xz
          tar xzf sdl.tar.gz

      - name: Build
        run: |
          T="$RUNNER_TEMP/tools"
          make TARGET=win -j"$(nproc)" \
            MINGW="$T/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64" \
            SDLMINGW="$T/SDL2-2.32.10/x86_64-w64-mingw32"

      - name: Package
        run: |
          T="$RUNNER_TEMP/tools"
          D=C64-GrooveGoat-Windows-x64
          mkdir -p "$D"
          "$T/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin/llvm-strip" -o "$D/GrooveGoat.exe" build/win/GrooveGoat.exe
          cp -r examples "$D/"
          sed 's/$/\r/' docs/manual.txt > "$D/Manual.txt"
          sed 's/$/\r/' docs/credits.txt > "$D/CREDITS.txt"
          sed 's/$/\r/' copying > "$D/COPYING.txt"
          sed 's/$/\r/' README.md > "$D/README.txt"
          mkdir -p "$D/licenses" && cp res/fonts/OFL.txt res/fonts/MesloLGS-NF-LICENSE.txt "$D/licenses/"

      - uses: actions/upload-artifact@v4
        with:
          name: C64-GrooveGoat-Windows-x64
          path: C64-GrooveGoat-Windows-x64
          retention-days: 30
